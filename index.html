<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KRDAI（クロダイ） 🚀 - 4人のパートナーと対話しよう</title>

  <!-- Futuristic Sci-Fi Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="scifi-theme">
  <div id="app" class="cyber-container">
    
    <!-- Background Grid & Starfield Effects -->
    <div class="cyber-bg-grid"></div>
    <div class="cyber-glowing-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <!-- Header -->
    <header class="app-header scifi-header">
      <div class="header-content">
        <h1 class="app-title">
          <span class="title-badge">KRDAI v5.0</span>
          <span class="title-text">KRDAI <span class="accent-text">（クロダイ）</span></span>
        </h1>
        <div class="header-actions">
          <button id="btn-reset-chat" class="btn-cyber-icon" title="新しくやり直す">
            🔄 <span class="btn-label">RESET</span>
          </button>
          <button id="btn-settings" class="btn-cyber-icon" title="システム設定">
            ⚙️ <span class="btn-label">CONFIG</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-container scrollable-chat-area">

      <!-- Character Banner (Pods) -->
      <section class="character-banner scifi-pods">
        <div class="character-card char-daigorou pod-card">
          <div class="char-avatar-img zoom-face"><img src="/avatars/daigorou.jpg" alt="だいごろう"></div>
          <div class="char-info">
            <span class="char-name">だいごろう</span>
            <span class="char-role">⚡ ひらめき</span>
          </div>
        </div>

        <div class="character-card char-chiikido pod-card">
          <div class="char-avatar-img zoom-face"><img src="/avatars/chiikido.jpg" alt="チイキド博士"></div>
          <div class="char-info">
            <span class="char-name">チイキド博士</span>
            <span class="char-role">🛸 もの知り</span>
          </div>
        </div>

        <div class="character-card char-tokibaa pod-card">
          <div class="char-avatar-img zoom-face"><img src="/avatars/tokibaa.jpg" alt="トキばあ"></div>
          <div class="char-info">
            <span class="char-name">トキばあ</span>
            <span class="char-role">🛡️ おっとり</span>
          </div>
        </div>

        <div class="character-card char-motoyama pod-card">
          <div class="char-avatar-img zoom-face"><img src="/avatars/motoyama.jpg" alt="本山さん"></div>
          <div class="char-info">
            <span class="char-name">本山さん</span>
            <span class="char-role">💫 共感</span>
          </div>
        </div>
      </section>

      <!-- User Profile / Name setup -->
      <section class="user-profile-section cyber-profile">
        <div class="profile-box scifi-box">
          <span class="cyber-label-prefix">ID:</span>
          <label for="input-child-name" class="profile-label">お名前：</label>
          <input type="text" id="input-child-name" placeholder="名前" value="きみ" maxlength="10">
          <select id="select-honorific" class="honorific-select scifi-select">
            <option value="ちゃん">ちゃん</option>
            <option value="くん" selected>くん</option>
            <option value="隊長">隊長</option>
            <option value="博士">博士</option>
          </select>
        </div>
      </section>

      <!-- Suggested Quick Prompts (Only visible at start) -->
      <section id="suggestions-area" class="suggestions-container scifi-card">
        <span class="suggestions-title">👾 おすすめの会話テーマ（タップしてみてね）：</span>
        <div class="suggestion-tags">
          <button class="tag-btn scifi-tag" data-question="空はどうして青いの？">🌤️ 空はどうして青いの？</button>
          <button class="tag-btn scifi-tag" data-question="ロボットとお友達になれるかな？">🤖 ロボットとお友達になれる？</button>
          <button class="tag-btn scifi-tag" data-question="どうしてお腹が空くの？">🍙 どうしてお腹が空くの？</button>
          <button class="tag-btn scifi-tag" data-question="未来の車はどうやって走るの？">🚗 未来の車はどう走る？</button>
        </div>
      </section>

      <!-- Dialogue History Thread Section -->
      <section id="dialogue-section" class="dialogue-section">
        <div class="dialogue-header">
          <h2><span class="cyber-icon">💬</span> CHAT LOG STREAM</h2>
          <button id="btn-read-all" class="btn-secondary scifi-sub-btn">
            🔊 VOICE READOUT
          </button>
        </div>

        <div id="dialogue-list" class="dialogue-list scifi-dialogue-list">
          <!-- Continuous chat messages appear here dynamically -->
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="loading-container hidden">
          <div class="cyber-radar-spinner">
            <div class="radar-sweep"></div>
          </div>
          <p class="loading-text cyber-glow-text">4人が会話のへんじを考えています... 📡</p>
        </div>
      </section>

    </main>

    <!-- FIXED BOTTOM CHAT CONSOLE (Always visible at the bottom) -->
    <footer class="fixed-bottom-chat-bar">
      <div class="bottom-chat-container">

        <!-- Voice Recognition Pulse Bar -->
        <div id="voice-status" class="voice-status-bar hidden">
          <span class="pulse-dot"></span> <span id="voice-status-text">声を聞いているよ... 👂</span>
        </div>

        <div class="chat-controls-wrapper">
          <!-- Big Primary Mic Button -->
          <button id="btn-mic" class="btn-mic-bottom">
            <span class="mic-icon">🎙️</span>
            <span id="mic-text" class="mic-text-short">こえで はなす</span>
          </button>

          <!-- Text Input Field & Send Button -->
          <div class="bottom-input-group">
            <input type="text" id="question-input" placeholder="ここにも 文字で書いて返事できるよ！" autocomplete="off">
            <button id="btn-ask" class="btn-send-bottom">
              <span class="btn-text">送信</span>
            </button>
          </div>
        </div>

      </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card scifi-modal">
        <div class="modal-header">
          <h3>⚙️ SYSTEM CONFIG</h3>
          <button id="btn-close-modal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="api-key-input">🔑 Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." autocomplete="off">
          </div>
          <div class="form-group">
            <label for="select-model">🤖 Target AI Model</label>
            <select id="select-model" class="model-select scifi-select" disabled>
              <option value="gemini-3.1-flash-lite" selected>gemini-3.1-flash-lite (Fixed)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="check-auto-speech">🔊 Realtime Voice Synthesis</label>
            <input type="checkbox" id="check-auto-speech" checked>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-save-settings" class="btn-primary-scifi">SAVE & CLOSE</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
